[package]
name = "rust_idempotency"
version = "0.1.0"
edition = "2024"

[dependencies]

# Web framework
axum = "0.8"

# Runtime async
tokio = { version = "1", features = ["full"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Variáveis de ambiente
dotenvy = "0.15"

# UUID para Idempotency-Key
uuid = { version = "1", features = ["v4"] }